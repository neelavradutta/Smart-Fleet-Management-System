# Deploy always-on gateway: fly launch --config apps/api-gateway/fly.toml
app = "sfms-api-gateway"
primary_region = "bom"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
